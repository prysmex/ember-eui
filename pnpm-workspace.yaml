packages:
  - packages/*
  - site

# The site consumes the packages as *injected* (copied) dependencies rather
# than symlinks, so their peer dependencies (ember-source, @glimmer/*,
# ember-basic-dropdown, ...) resolve to the site's versions and not to each
# package's own devDependencies (which would put two Embers in the bundle).
injectWorkspacePackages: true

# Refresh the injected copies whenever a package's `build` script finishes.
# `pnpm start` (rollup --watch) and turbo cache hits don't finish a script, so
# the site also runs scripts/sync-injected.mjs (see site/package.json).
syncInjectedDepsAfterScripts:
  - build

peerDependencyRules:
  allowAny:
    - ember-source

overrides:
  '@ember/string': ^4.0.0

# Packages whose types import @glint/template (or ember-source) without
# declaring it: as optional peers they resolve each consumer's own version.
# Otherwise they get whichever copy pnpm happens to hoist (e.g. the site's
# @glint/template 1.9 in the packages, which use 1.5), and glint fails.
packageExtensions:
  '@svg-jar/plugin':
    peerDependencies:
      ember-source: '*'
      '@glint/template': '*'
    peerDependenciesMeta:
      ember-source:
        optional: true
      '@glint/template':
        optional: true
  ember-element-helper:
    peerDependencies:
      '@glint/template': '*'
    peerDependenciesMeta:
      '@glint/template':
        optional: true

# dependency install scripts run only when allowed (pnpm >= 11 errors on
# unlisted ones)
allowBuilds:
  esbuild: true # validates its platform binary
  core-js: false # postinstall only prints a donation message
